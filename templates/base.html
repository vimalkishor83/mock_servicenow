<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mock ServiceNow{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('common_static', filename='bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('common_static', filename='bootstrap-icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/snow.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark snow-nav">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('ui.dashboard') }}">
      <i class="bi bi-cloud-fill fs-5"></i>
      <span>Mock ServiceNow</span>
      <span class="badge bg-warning text-dark ms-1" style="font-size:.65rem;vertical-align:middle">DEV</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == request.script_root + '/' or request.path == request.script_root + '/dashboard' %}active{% endif %}" href="{{ url_for('ui.dashboard') }}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/ui/incidents' in request.path %}active{% endif %}" href="{{ url_for('ui.incidents') }}">
            <i class="bi bi-ticket-detailed me-1"></i>Incidents
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/ui/kb' in request.path %}active{% endif %}" href="{{ url_for('ui.kb_list') }}">
            <i class="bi bi-journal-richtext me-1"></i>Knowledge Base
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ request.script_root }}/swagger" target="_blank">
            <i class="bi bi-braces me-1"></i>API Docs
          </a>
        </li>
      </ul>
      <span class="navbar-text text-white-50 small">
        <i class="bi bi-server me-1"></i>localhost:8080
      </span>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-3 flex-grow-1">
  {% block content %}{% endblock %}
</div>

<footer class="snow-footer mt-auto">
  <div class="container-fluid px-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span><i class="bi bi-cloud-fill me-1 text-primary"></i><strong>Mock ServiceNow</strong> — Development &amp; Integration Testing Server</span>
      <div class="d-flex gap-3">
        <a href="{{ request.script_root }}/swagger" target="_blank" class="text-muted text-decoration-none small"><i class="bi bi-braces me-1"></i>API Docs</a>
        <a href="{{ request.script_root }}/api/now/table/incident" target="_blank" class="text-muted text-decoration-none small"><i class="bi bi-link-45deg me-1"></i>REST API</a>
        <span class="text-muted small"><i class="bi bi-code-slash me-1"></i>Flask + SQLite</span>
      </div>
    </div>
  </div>
</footer>

<script src="{{ url_for('common_static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/snow.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
